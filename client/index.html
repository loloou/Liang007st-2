<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>liang007</title>
    <link rel="icon" type="image/x-icon" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data: blob:; connect-src 'self' https: http:; font-src 'self' data:;" />
    <style>
      /* 启动加载指示器 — React 挂载后自动移除 */
      #splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0f;gap:18px;transition:opacity .3s}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .ring{width:36px;height:36px;border:2px solid rgba(240,192,64,.15);border-top-color:rgba(240,192,64,.7);border-radius:50%;animation:spin .7s linear infinite}
      #splash .label{font:500 12px/1 system-ui,sans-serif;color:rgba(240,192,64,.55);letter-spacing:.12em}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="bg-[#0a0a0f]">
    <div id="splash"><div class="ring"></div><div class="label">LOADING</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
